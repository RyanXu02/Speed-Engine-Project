name: Lint

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
    paths:
      - "**/*.c"
      - "**/*.cpp"
      - "**/*.h"
      - "**/*.json"
      - ".github/workflows/.clang-format"

permissions: {}

jobs:
  analyze:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Lint C/C++ and JSON files
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        id: superlinter
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IGNORE_GITIGNORED_FILES: true
          LINTER_RULES_PATH: .github/workflows
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_CLANG_FORMAT: true
          VALIDATE_JSON: true
          VALIDATE_JSON_PRETTIER: true
          FIX_CLANG_FORMAT: true
          FIX_JSON: true
          FIX_JSON_PRETTIER: true

      - name: Detect lint fixes
        id: lint_fixes
        if: always()
        shell: bash
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "has_fixes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_fixes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create fixes pull request
        uses: peter-evans/create-pull-request@v8
        id: cpr
        if: >-
          always() &&
          steps.lint_fixes.outputs.has_fixes == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          commit-message: Apply lint fixes
          title: Apply lint fixes
          branch: lint-fixes-${{ github.head_ref || github.ref_name }}
          body: |
            Automatic lint fixes for C/C++ formatting and JSON formatting.
            Please review the changes and merge if they are correct.
          base: ${{ github.head_ref || github.ref_name }}

      - name: Fail if lint found issues without fixes
        if: >-
          always() &&
          steps.superlinter.outcome == 'failure' &&
          steps.lint_fixes.outputs.has_fixes != 'true'
        run: exit 1

      - name: Fail if PR created
        if: >-
          always() &&
          steps.cpr.outputs.pull-request-url != ''
        run: |
          echo "A PR with lint fixes has been created: ${{ steps.cpr.outputs.pull-request-url }}"
          exit 1
