name: MSBuild

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  PROJECT_FILE_PATH: SpeedEngine/SpeedEngine.vcxproj
  BUILD_CONFIGURATION: Debug
  BUILD_PLATFORM: x64

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache vcpkg
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\vcpkg\archives
            SpeedEngine\vcpkg_installed
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('SpeedEngine/vcpkg.json', 'SpeedEngine/SpeedEngine.vcxproj') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build with MSBuild
        run: >
          msbuild
          "${{ env.PROJECT_FILE_PATH }}"
          /m
          /p:Configuration=${{ env.BUILD_CONFIGURATION }}
          /p:Platform=${{ env.BUILD_PLATFORM }}